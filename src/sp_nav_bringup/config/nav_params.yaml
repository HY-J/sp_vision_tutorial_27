planner_server:
  ros__parameters:
    costmap_topic: "/global_costmap"
    local_costmap_topic: "/local_costmap/costmap"  # ✅ 和仿真器发布的局部代价地图对齐
    path_topic: "/global_path"
    plugin_name: "AStar"
    plugin_type: "sp_global_planner/AStarPlanner"  # XML 中 name 字段的值
    AStar:
      lethal_cost: 100
      cost_weight: 5.0

esdf_map_publisher:
  ros__parameters:
    map_yaml: "sp_nav_bringup/map/maze_map.yaml"
    frame_id: "map"
    publish_rate_hz: 1.0
    unknown_as_obstacle: false
    robot_radius: 0.25
    margin: 0.30
    d_safe: 0.70
    w: 15.0
    unknown_cost: 255
    visualize_esdf: false

controller_server:
  ros__parameters:
    local_path_topic: "/global_path"
    odom_topic: "/Odometry"                  # 仿真器发布的大写 O
    odom_frame_id: "lidar_odom"              # 仿真器的里程计坐标系
    map_frame_id: "map"
    cmd_vel_topic: "/sentry/cmd_vel"         # 仿真器订阅的速度话题
    base_frame_id: "base_link"
    control_frequency: 50.0
    plugin_name: "PidController"
    plugin_type: "PidController"
    PidController:
      base_frame_id: "base_link"
      kp: 2.0
      ki: 0.02
      kd: 0.5
      max_linear_vel: 0.8
      min_linear_vel: 0.08
      lookahead_dist: 1.2
      goal_tolerance: 0.10
      max_integral: 0.3

sp_decision:
  ros__parameters:
    tick_rate_hz: 10.0
    tree_files:
      - "sp_decision/decision_trees/click_nav.xml"
    bt_plugins:
      - "nav_to_pose_bt_node"
      - "condition_judge_bt_node"
      - "wait_duration_bt_node"
      - "gimbal_control_bt_node"
      - "chassis_mode_bt_node"
      - "set_double_bt_node"

nav_interface_node:
  ros__parameters:
    default_bt_xml: "sp_nav_bt/nav_bt/default_nav_with_fallback.xml"
    enable_bt_cout_logger: false
    bt_plugins:
      - "nav_compute_path_service"
      - "nav_state_track"
      - "nav_rate_control"
      - "nav_repeat_sequence"
      - "nav_get_pose"
      - "nav_set_control_enable"
